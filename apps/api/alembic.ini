# Alembic configuration for the Veridion schema.
#
# The database URL is not set here: migrations/env.py reads it from Veridion's settings
# (DATABASE_URL in the environment or .env), so migrations always target the same
# database as the application. Prefer the CLI wrappers:
#
#   veridion db upgrade               apply all migrations
#   veridion db revision -m "..."     autogenerate a migration from model changes
#   veridion db check                 fail if the models and migrations have drifted

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 48

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
