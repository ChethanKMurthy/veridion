# Render Blueprint: the Veridion API and its PostgreSQL database.
# The web app runs on Vercel and proxies /api/* here (see docs/deployment.md).
#
# Free plan trade-offs: the API sleeps after 15 minutes without traffic (about a minute to wake),
# uploaded PDFs are lost whenever it restarts (free services have no persistent disk), and the
# free database expires 30 days after creation. Move to paid plans before relying on it.

services:
  - type: web
    name: veridion-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    # Migrations run at start-up (free services have no release step); a database lock keeps
    # concurrent instances from applying them twice. The port comes from $PORT.
    dockerCommand: veridion serve --host 0.0.0.0 --migrate
    healthCheckPath: /api/v1/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
    envVars:
      - key: VERIDION_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: veridion-db
          property: connectionString
      # Free plans have no background workers, so jobs run inside the API process.
      - key: EMBEDDED_WORKER
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: COOKIE_SECURE
        value: "true"
      # Requests arrive through Render's proxy (and Vercel's), which set X-Forwarded-For.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: OCR_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_MAX_CONCURRENCY
        value: "2"
      # Prompted for when the Blueprint is created; never stored in the repository.
      - key: GROQ_API_KEY
        sync: false
      - key: PLATFORM_ADMIN_EMAILS
        sync: false

databases:
  - name: veridion-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: veridion
    user: veridion
    # No public access: only services inside Render can connect.
    ipAllowList: []
